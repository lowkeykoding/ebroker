<div class="flex min-h-screen">
  <div class="mx-auto">
    <div class="w-lg max-w-screen flex flex-1 flex-col justify-center px-4 py-12 sm:px-6">

        <!-- Brand -->
        <div>
          <span class="text-2xl font-bold text-primary">EBroker</span>
          <h2 class="mt-8 text-2xl/9 font-bold tracking-tight">Create your account</h2>
        </div>

        <!-- Form -->
        <div class="mt-10">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
            <div hlmFieldGroup>

              <div hlmField>
                <label hlmFieldLabel for="firstName">First Name</label>
                <input
                  hlmInput
                  id="firstName"
                  type="text"
                  formControlName="firstName"
                  autocomplete="firstName"
                />
              </div>

              <div hlmField>
                <label hlmFieldLabel for="lastName">Last Name</label>
                <input
                  hlmInput
                  id="lastName"
                  type="text"
                  formControlName="lastName"
                  autocomplete="lastName"
                />
              </div>

              <div hlmField>
                <label hlmFieldLabel for="email">Email address</label>
                <input
                  hlmInput
                  id="email"
                  type="email"
                  formControlName="email"
                  autocomplete="email"
                />
              </div>

              <div hlmField>
                <label hlmFieldLabel for="password">Password</label>
                <input
                  hlmInput
                  id="password"
                  type="password"
                  formControlName="password"
                  autocomplete="password"
                />
              </div>

              <div hlmField>
                <label hlmFieldLabel for="confirmPassword">Confirm Password</label>
                <input
                  hlmInput
                  id="confirmPassword"
                  type="password"
                  formControlName="confirmPassword"
                  autocomplete="confirmPassword"
                />
              </div>
            </div>

            @if (error()) {
              <div class="rounded-md bg-red-50 p-4">
                <p class="text-sm text-red-700">{{ error() }}</p>
              </div>
            }

            <div>
              <button
                hlmBtn
                size="lg"
                type="submit"
                [disabled]="loading()"
                class="flex w-full"
              >
                @if (loading()) {
                  Creating account...
                } @else {
                  Create account
                }
              </button>
            </div>

            <p class="text-center text-sm/6 text-gray-500">
              Already have an account?
              <a routerLink="/auth/login" class="font-semibold text-primary">Sign in</a>
            </p>

          </form>
        </div>

    </div>
  </div>
</div>
