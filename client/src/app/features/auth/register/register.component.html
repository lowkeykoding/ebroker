<div class="flex min-h-screen">
  <div class="mx-auto">
    <div class="w-full max-w-xl flex flex-1 flex-col justify-center px-4 py-12 sm:px-6">

        <!-- Brand -->
        <div>
          <span class="text-2xl font-bold text-indigo-600">EBroker</span>
          <h2 class="mt-8 text-2xl/9 font-bold tracking-tight text-gray-900">Create your account</h2>
        </div>

        <!-- Form -->
        <div class="mt-10">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

            <div>
              <label for="email" class="block text-sm/6 font-medium text-gray-900">Email address</label>
              <div class="mt-2">
                <input
                  id="email"
                  type="email"
                  formControlName="email"
                  autocomplete="email"
                  class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
                />
              </div>
            </div>

            <div>
              <label for="password" class="block text-sm/6 font-medium text-gray-900">Password</label>
              <div class="mt-2">
                <input
                  id="password"
                  type="password"
                  formControlName="password"
                  autocomplete="new-password"
                  class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
                />
              </div>
            </div>

            <div>
              <label for="confirmPassword" class="block text-sm/6 font-medium text-gray-900">Confirm password</label>
              <div class="mt-2">
                <input
                  id="confirmPassword"
                  type="password"
                  formControlName="confirmPassword"
                  autocomplete="new-password"
                  class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
                />
              </div>
            </div>

            @if (error()) {
              <div class="rounded-md bg-red-50 p-4">
                <p class="text-sm text-red-700">{{ error() }}</p>
              </div>
            }

            <div>
              <button
                type="submit"
                [disabled]="loading()"
                class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed"
              >
                @if (loading()) {
                  Creating account...
                } @else {
                  Create account
                }
              </button>
            </div>

            <p class="text-center text-sm/6 text-gray-500">
              Already have an account?
              <a routerLink="/auth/login" class="font-semibold text-indigo-600 hover:text-indigo-500">Sign in</a>
            </p>

          </form>
        </div>

    </div>
  </div>
</div>
