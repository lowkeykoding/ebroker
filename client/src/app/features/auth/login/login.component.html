<div class="flex min-h-screen">
  <!-- Left panel: form -->
  <div class="flex flex-1 flex-col justify-center px-4 py-12 sm:px-6 lg:flex-none lg:px-20 xl:px-24">
    <div class="mx-auto w-full max-w-sm lg:w-96">

      <!-- Brand -->
      <div>
        <span class="text-2xl font-bold">EBroker</span>
        <h2 class="mt-8 text-2xl/9 font-bold tracking-tight">Sign in to your account</h2>
      </div>

      <!-- Form -->
      <div class="mt-10">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

          <div hlmField>
            <label hlmFieldLabel for="email">Email address</label>
            <input
              hlmInput
              id="email"
              type="email"
              formControlName="email"
              autocomplete="email"
              required />
          </div>

          <div hlmField>
            <label hlmFieldLabel for="password">Password</label>
              <input
                hlmInput
                id="password"
                type="password"
                formControlName="password"
                autocomplete="current-password"
                required
              />
          </div>

          <div class="flex items-center justify-between">
            <div class="text-sm/6">
              <a routerLink="/auth/register" class="font-semibold text-primary">Create an account</a>
            </div>
            <div class="text-sm/6">
              <a href="#" class="font-semibold text-primary">Forgot password?</a>
            </div>
          </div>

          @if (error()) {
            <div class="rounded-md bg-red-50 p-4">
              <p class="text-sm text-red-700">{{ error() }}</p>
            </div>
          }

          <div>
            <button
              hlmBtn
              type="submit"
              size="lg"
              class="flex w-full"
              [disabled]="loading()"
            >
              @if (loading()) {

                Signing in...
              } @else {
                Sign in
              }
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>

  <!-- Right panel: background image -->
  <div class="relative hidden w-0 flex-1 lg:block">
    <img
      class="absolute inset-0 size-full object-cover"
      src="/images/login.webp"
      alt="alt"
    />
  </div>
</div>
